name: varagh

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://varagh:varagh@db:5432/varagh}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  TIMEZONE: ${TIMEZONE:-Asia/Tehran}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
  BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
  BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-slack}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-varagh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varagh}
      POSTGRES_DB: ${POSTGRES_DB:-varagh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varagh} -d ${POSTGRES_DB:-varagh}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  tests:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      <<: *app-env
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://varagh:varagh@db:5432/varagh_test}
      ENVIRONMENT: test
      DATA_DIR: /tmp/varagh-test-data
    command: ["sh", "-c", "ruff check . && pytest"]
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      <<: *app-env
      ENVIRONMENT: production
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      <<: *app-env
      ENVIRONMENT: production
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
